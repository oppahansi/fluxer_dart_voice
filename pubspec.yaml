name: fluxer_dart_voice
description: >-
  Voice support for the fluxer_dart ecosystem: Fluxer's gateway voice
  handshake plus the LiveKit media transport it hands off to. Not yet
  implemented — scaffolding only.
version: 0.1.0
homepage: https://github.com/oppahansi/fluxer_dart_voice
repository: https://github.com/oppahansi/fluxer_dart_voice
# Not on pub.dev yet — remove this line once it's actually published there.
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  # Pinned to a tagged sibling release so a plain `dart pub get` works
  # for anyone who clones just this repo. Local development overrides
  # these to sibling directories via pubspec_overrides.yaml (gitignored,
  # not this file) — see CONTRIBUTING.md.
  fluxer_dart_core:
    git:
      url: https://github.com/oppahansi/fluxer_dart_core.git
      ref: v0.1.0
  fluxer_dart_gateway:
    git:
      url: https://github.com/oppahansi/fluxer_dart_gateway.git
      ref: v0.1.0
  fluxer_dart_utils:
    git:
      url: https://github.com/oppahansi/fluxer_dart_utils.git
      ref: v0.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
